[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primocut"
version = "0.4.0"
description = "PRIMOCUT: live URL -> audio -> transcription -> chat -> topics in Markdown"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=0.40",
    "rich>=13.7",
    "faster-whisper>=1.0",
    "chat-downloader>=0.2",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
# Surgical WhisperX boundary alignment (Phase 3). MUST be installed into a
# SEPARATE venv (`.venv-align`), NOT the worker venv: whisperx pins
# huggingface-hub<1.0 and drags a torch 2.8 / pyannote 4 / CUDA stack that would
# mutate the validated faster-whisper environment. The render worker shells out
# to this venv's interpreter (PRIMOCUT_ALIGN_PYTHON); see .env.example.
align = [
    "whisperx>=3.8",
]

[project.scripts]
primocut = "primocut.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
